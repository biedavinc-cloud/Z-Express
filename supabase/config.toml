# Supabase project configuration.
# Every function authenticates the caller itself (platform.ts), and several are
# public by design (tracking, quotes, merchant API with API keys, payment webhook),
# so the gateway-level JWT check is switched off for all of them.
project_id = "xoqhibsuyrvfjbmmvsma"

[auth]
site_url = "https://express.zanldo.com"
additional_redirect_urls = [
  "https://express.zanldo.com/login",
  "https://express.zanldo.com/reset-password",
  "http://localhost:5173/login",
  "http://localhost:5173/reset-password",
]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_confirmations = true



# --- BEGIN generated email templates --- (scripts/gen-email-templates.mjs)
[auth.email.template.confirmation]
subject = "Your Z. Express verification code · Votre code de vérification"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "You are invited to Z. Express · Vous êtes invité sur Z. Express"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Z. Express password · Réinitialisez votre mot de passe"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Z. Express sign-in link · Votre lien de connexion"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email address · Confirmez votre nouvelle adresse e-mail"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your Z. Express security code · Votre code de sécurité"
content_path = "./supabase/templates/reauthentication.html"
# --- END generated email templates ---

